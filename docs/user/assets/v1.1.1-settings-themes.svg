<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Settings theme selection</title>
  <desc id="desc">Annotated documentation image showing Settings with Dock color theme selection.</desc>
  <rect width="960" height="540" fill="#f7f9fc"/>
  <rect x="118" y="48" width="724" height="444" rx="18" fill="#ffffff" stroke="#d7deea" stroke-width="2"/>
  <text x="154" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#233142">OBS Duel Recorder Settings</text>
  <text x="154" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5d6d7e">Runtime, Worker, overlay, and Dock appearance settings.</text>

  <rect x="154" y="166" width="652" height="70" rx="12" fill="#eef4f8"/>
  <text x="180" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#263947">Runtime data</text>
  <text x="180" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#52616b">Configured path is shown without secrets in documentation images.</text>

  <rect x="154" y="258" width="652" height="154" rx="12" fill="#fffaf1" stroke="#ffd08a"/>
  <text x="180" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#6f4800">Dock color theme</text>
  <text x="180" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64513a">Themes are selectable and apply without blocking setup or recording controls.</text>

  <g transform="translate(180 342)">
    <rect width="118" height="44" rx="12" fill="#274c77"/>
    <circle cx="24" cy="22" r="8" fill="#2ec4b6"/>
    <circle cx="48" cy="22" r="8" fill="#ff9f1c"/>
    <circle cx="72" cy="22" r="8" fill="#f05d5e"/>
    <text x="24" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#31414f">Classic</text>
  </g>
  <g transform="translate(338 342)">
    <rect width="118" height="44" rx="12" fill="#354f52"/>
    <circle cx="24" cy="22" r="8" fill="#84a98c"/>
    <circle cx="48" cy="22" r="8" fill="#cad2c5"/>
    <circle cx="72" cy="22" r="8" fill="#f4a261"/>
    <text x="24" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#31414f">Forest</text>
  </g>
  <g transform="translate(496 342)">
    <rect width="118" height="44" rx="12" fill="#5b3c88"/>
    <circle cx="24" cy="22" r="8" fill="#ffafcc"/>
    <circle cx="48" cy="22" r="8" fill="#bde0fe"/>
    <circle cx="72" cy="22" r="8" fill="#ffd166"/>
    <text x="24" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#31414f">Bright</text>
  </g>

  <rect x="634" y="432" width="78" height="32" rx="16" fill="#eef2f7" stroke="#c9d3dd"/>
  <text x="658" y="453" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#4d5b68">Cancel</text>
  <rect x="724" y="432" width="82" height="32" rx="16" fill="#2ec4b6"/>
  <text x="753" y="453" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#073b3a">Save</text>
</svg>
