<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">OBS Duel Recorder Dock overview</title>
  <desc id="desc">Annotated documentation image showing the planned v1.1.1 Dock layout with status, setup, recording, metadata, upload, and help controls.</desc>
  <rect width="960" height="600" fill="#f7f9fc"/>
  <rect x="40" y="32" width="880" height="536" rx="18" fill="#ffffff" stroke="#d7deea" stroke-width="2"/>
  <rect x="40" y="32" width="880" height="84" rx="18" fill="#274c77"/>
  <text x="72" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">OBS Duel Recorder</text>
  <text x="676" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#dff3ff">Worker</text>
  <rect x="736" y="52" width="128" height="34" rx="17" fill="#2ec4b6"/>
  <text x="770" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#082b2a">Running</text>

  <rect x="72" y="144" width="250" height="130" rx="14" fill="#e8f7f4" stroke="#84d9cf"/>
  <text x="96" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f4c5c">Setup</text>
  <text x="96" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#26535a">Runtime: ready</text>
  <text x="96" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#26535a">Templates: start/end tested</text>
  <rect x="96" y="246" width="112" height="24" rx="12" fill="#2ec4b6"/>
  <text x="120" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#073b3a">Open setup</text>

  <rect x="354" y="144" width="250" height="130" rx="14" fill="#fff3df" stroke="#ffd08a"/>
  <text x="378" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#7c4700">Recording</text>
  <text x="378" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5a4529">Last result: stopped</text>
  <text x="378" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5a4529">Output evidence shown here</text>
  <rect x="378" y="246" width="82" height="24" rx="12" fill="#ff9f1c"/>
  <text x="404" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#3d2400">Start</text>
  <rect x="470" y="246" width="82" height="24" rx="12" fill="#f05d5e"/>
  <text x="497" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Stop</text>

  <rect x="636" y="144" width="250" height="130" rx="14" fill="#edf2ff" stroke="#b6c7ff"/>
  <text x="660" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#304c89">Upload</text>
  <text x="660" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#39445f">Queue: 1 ready</text>
  <text x="660" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#39445f">Review required before upload</text>
  <rect x="660" y="246" width="112" height="24" rx="12" fill="#5b7cfa"/>
  <text x="687" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Review</text>

  <rect x="72" y="312" width="392" height="156" rx="14" fill="#fff7fb" stroke="#ffb3d1"/>
  <text x="96" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#8a2d5d">Metadata</text>
  <text x="96" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5c3650">Deck, opponent, result, and memo are reviewed here.</text>
  <text x="96" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#5c3650">Recognition candidates stay suggestions until applied.</text>
  <rect x="96" y="426" width="132" height="26" rx="13" fill="#d45087"/>
  <text x="124" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Edit metadata</text>

  <rect x="496" y="312" width="390" height="156" rx="14" fill="#f2f6f8" stroke="#cdd8df"/>
  <text x="520" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#354f52">Diagnostics</text>
  <text x="520" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#455a60">Worker launch, setup, and upload errors appear as actions.</text>
  <text x="520" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#455a60">Detailed logs remain available but are not the main view.</text>
  <rect x="520" y="426" width="88" height="26" rx="13" fill="#52796f"/>
  <text x="548" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Help</text>
  <rect x="618" y="426" width="96" height="26" rx="13" fill="#84a98c"/>
  <text x="644" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#16332b">Settings</text>

  <line x1="812" y1="98" x2="792" y2="144" stroke="#1d3557" stroke-width="3"/>
  <circle cx="812" cy="98" r="6" fill="#1d3557"/>
  <text x="690" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1d3557">status first</text>
  <line x1="160" y1="494" x2="160" y2="468" stroke="#1d3557" stroke-width="3"/>
  <circle cx="160" cy="494" r="6" fill="#1d3557"/>
  <text x="96" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1d3557">primary tasks grouped by user workflow</text>
</svg>
