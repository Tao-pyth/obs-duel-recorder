[project]
name = "obs-duel-recorder-worker"
version = "0.2.0-dev"
description = "Python Worker for OBS Duel Recorder"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tao-pyth" }]

# v0.2 skeleton: keep dependencies minimal. Later issues add FastAPI/uvicorn.
dependencies = []

[project.scripts]
odr-worker = "odr_worker.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
