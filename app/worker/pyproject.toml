[project]
name = "obs-duel-recorder-worker"
version = "0.2.0-dev"
description = "Python Worker for OBS Duel Recorder"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tao-pyth" }]

# v0.2: minimal localhost HTTP API foundation.
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.scripts]
odr-worker = "odr_worker.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
