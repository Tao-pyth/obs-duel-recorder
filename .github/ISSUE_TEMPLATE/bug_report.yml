name: Bug report
description: Report a reproducible problem in OBS Duel Recorder
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: The Worker fails to start when...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Keep this focused and reproducible.
      placeholder: |
        1. Start OBS...
        2. Open the dock...
        3. Trigger...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The recorder should...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Instead...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - OBS Plugin
        - Python Worker
        - Dock UI / overlay
        - SQLite / runtime data
        - YouTube upload
        - Documentation
        - Unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.2.0, commit SHA, or branch name
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OBS version, OS, Python version, plugin/worker launch method
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove OAuth tokens, secrets, local account details, game screenshots, and generated exports before posting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, OAuth tokens, logs with private data, and Yu-Gi-Oh! Master Duel assets/screenshots.
          required: true
        - label: I searched existing issues before opening this report.
          required: true
