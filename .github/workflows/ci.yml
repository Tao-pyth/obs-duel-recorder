name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Docs validation
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Markdown links
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File docs/tools/validate_markdown_links.ps1

      - name: Validate Japanese user docs coverage
        shell: powershell
        run: python scripts/validate_jp_user_docs_coverage.py --root .

      - name: Build documentation site artifact
        run: python scripts/build_docs_site.py --root . --output build/docs-site

      - name: Validate v0.4 plugin smoke collector
        shell: powershell
        run: |
          $report = Join-Path $env:TEMP "v0.4-plugin-smoke-report.md"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/collect_v0_4_plugin_smoke.ps1 -SkipBuild -DockState not_started -SettingsFlow ci_skipbuild -WorkerOwnership none -ReportPath $report
          if (-not (Test-Path -LiteralPath $report)) {
            throw "Smoke report was not generated: $report"
          }
          Select-String -LiteralPath $report -SimpleMatch "# v0.4 Plugin Smoke Report" -Quiet | ForEach-Object {
            if (-not $_) { throw "Smoke report heading was not found: $report" }
          }

      - name: Validate release package builder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build/plugin/Release | Out-Null
          Set-Content -LiteralPath build/plugin/Release/obs-duel-recorder.dll -Value "ci fixture dll for package layout validation" -Encoding ASCII
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_release_package.ps1 -Version v0.12.0 -PluginDllPath build/plugin/Release/obs-duel-recorder.dll -OutputDir build/release -Clean

  worker-tests:
    name: Worker unit tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/worker/pyproject.toml

      - name: Install Worker package
        run: python -m pip install -e "app/worker[test]"

      - name: Run Worker tests
        run: python -m unittest discover -s app/worker/tests -p "test_*.py" -v
